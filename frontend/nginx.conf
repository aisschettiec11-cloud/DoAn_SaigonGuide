server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 21m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_read_timeout 90s; }
 location /swagger { proxy_pass http://api:8080; }
 location /media/ { proxy_pass http://api:8080; }
 location = /health { proxy_pass http://api:8080; }
 location = /sw.js { add_header Cache-Control "no-cache"; }
 location / { try_files $uri $uri/ /index.html; }
}
